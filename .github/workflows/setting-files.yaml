name: Setting File Format Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-check:
    runs-on: ubuntu-slim

    permissions:
      contents: read # required by actions/checkout to fetch repository code

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1

      - name: Install dependencies
        run: pnpm install

      - name: Format Check
        id: format-check
        run: pnpm format

      - name: Tips
        if: failure()
        run: |
          echo 'Try the following command in the project root'
          echo 'pnpm format:fix'

  required:
    # name 変更時は infra 側の required_status_checks も更新する
    name: Setting File Format Check / required
    needs: [format-check]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 1
    steps:
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
